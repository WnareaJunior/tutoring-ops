# Oracle XE 21c for development.
#
#   docker compose up -d
#   ./install.sh          # once the healthcheck reports healthy
#
# The gvenzl image creates APP_USER inside the XEPDB1 pluggable database on first
# boot, which is why nothing in this project is ever built in SYSTEM.
services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: tutoring-oracle
    # The host is stopped and started daily (a pay-per-hour VM); without this
    # the container stays exited after every boot and the deployed API finds
    # nothing at the far end of its connection.
    restart: unless-stopped
    ports:
      # Bound to loopback on purpose. This runs on a server, and "1521:1521"
      # would publish it on every interface -- an Oracle listener with a
      # development password, reachable by anything that can route to the box.
      # Reach it from a laptop with an SSH tunnel instead:
      #   ssh -N -L 1521:localhost:1521 you@server
      # Override only if you know what is in front of it:
      #   ORACLE_BIND=0.0.0.0 docker compose up -d
      - "${ORACLE_BIND:-127.0.0.1}:1521:1521"
    # Docker's default /dev/shm is 64MB. Oracle sizes its SGA against it and
    # fails to start with ORA-00845 when it is that small.
    shm_size: 1gb
    environment:
      # SYS/SYSTEM password. Local development only -- never used by the app.
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:-OraclePw1}
      # The application schema. All objects in db/migrations belong to this user.
      APP_USER: ${ORACLE_APP_USER:-tutoring}
      APP_USER_PASSWORD: ${ORACLE_APP_PASSWORD:-TutorPw1}
    volumes:
      - oracle-data:/opt/oracle/oradata
      # The scripts run through the container's own sqlplus, so the repo has to
      # be visible inside it. Read-only: nothing here writes to the mount.
      - ./:/db:ro
    healthcheck:
      # The image ships this script; it returns 0 only once the DB accepts logins.
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      # start_period is sized for a spinning disk. Creating the database is
      # random-I/O bound, so a 7200rpm drive can take 20+ minutes on first boot
      # where an SSD takes 3. Failures during start_period do not count against
      # retries, so a generous value costs nothing on fast hardware -- and a
      # container marked unhealthy while it is still legitimately working is a
      # much more expensive mistake to debug.
      retries: 40
      start_period: 900s

volumes:
  oracle-data:
